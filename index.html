<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="El aliento de los dioses">
<title>El aliento de los dioses · Seguimiento sin spoilers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a140e; --parch:#efe3c4; --parch2:#e2d2a8; --ink:#3b2a1a; --ink2:#5a4630;
    --red:#9b2a1c; --gold:#c9962e; --panel:#efe3c4f2; --barH:112px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IM Fell English",Georgia,serif;overflow:hidden}
  #viewport{position:fixed;inset:0 0 calc(var(--barH) + var(--sb)) 0;overflow:hidden;cursor:grab;touch-action:none}
  #viewport.drag{cursor:grabbing}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0}
  #stage img{display:block;user-select:none;-webkit-user-drag:none}

  /* ---- Lugares ---- */
  .place{position:absolute;transform-origin:0 0}
  .place .pin{position:absolute;left:-7px;top:-7px;width:14px;height:14px;transform:rotate(45deg);
    background:var(--red);border:2px solid var(--parch);box-shadow:0 0 0 1px var(--ink),0 1px 3px #0008}
  .place .lbl{position:absolute;left:12px;top:-12px;white-space:nowrap;font:italic 16px "IM Fell English",serif;color:var(--red);cursor:pointer;
    text-shadow:0 0 3px var(--parch),0 0 3px var(--parch),0 0 6px var(--parch),0 0 8px var(--parch)}
  .place.left .lbl{left:auto;right:12px}
  .place.link .lbl{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  .chips{position:absolute;left:12px;top:10px;display:flex;flex-wrap:wrap;gap:4px;width:170px}
  .place.left .chips{left:auto;right:12px;justify-content:flex-end}

  /* ---- Fichas de personaje (medallones) ---- */
  .chip{position:relative;width:32px;height:32px;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#f8eed6,var(--parch) 55%,var(--parch2));
    border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--parch),inset 0 0 0 3.5px var(--c),0 2px 4px #000a;
    display:flex;align-items:center;justify-content:center;
    font:15px "IM Fell English SC",serif;color:var(--c);letter-spacing:-.02em}
  .chip.new{box-shadow:inset 0 0 0 2px var(--parch),inset 0 0 0 3.5px var(--c),0 0 0 3px var(--gold),0 0 10px 2px #e8b84a,0 2px 4px #000a}
  .chip.dead{filter:grayscale(1);opacity:.75}
  .chip.dead::after{content:"✝";position:absolute;right:-5px;top:-7px;font-size:13px;color:var(--ink);
    text-shadow:0 0 2px var(--parch),0 0 3px var(--parch)}

  /* ---- Paneles ---- */
  .panel{background:var(--panel);border:1px solid var(--ink2);box-shadow:inset 0 0 0 3px var(--parch),inset 0 0 0 4px var(--ink2),0 4px 14px #000a;border-radius:3px}
  #maps{position:fixed;top:calc(12px + var(--st));left:calc(12px + var(--sl));display:flex;gap:6px;z-index:5}
  #maps button{background:var(--parch);color:var(--ink);border:1px solid var(--ink);padding:5px 14px;border-radius:2px;font:16px "IM Fell English SC",serif;cursor:pointer;box-shadow:0 2px 6px #0008}
  #maps button.on{background:var(--red);color:var(--parch);border-color:var(--ink)}
  #offmap{position:fixed;top:calc(58px + var(--st));left:calc(12px + var(--sl));width:270px;max-height:calc(70vh - var(--barH) - 90px);overflow:auto;padding:10px 14px;z-index:5}
  #offmap h3{margin:0 0 6px;font:16px "IM Fell English SC",serif;color:var(--red);border-bottom:1px solid var(--ink2);padding-bottom:3px}
  #offmap .offsec{margin:6px 0 8px}
  #offmap .offh{font:13px "IM Fell English SC",serif;color:var(--ink2);margin-top:8px;letter-spacing:.03em}
  #offmap .offt{font:italic 15px "IM Fell English",serif;color:var(--red);margin-bottom:4px}
  #offmap .offt.link{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  #offmap .chips{position:static;width:auto}
  #news{position:fixed;left:calc(12px + var(--sl));bottom:calc(var(--barH) + var(--sb) + 12px);width:350px;max-height:30vh;overflow:auto;padding:12px 16px;font-size:15px;z-index:5}
  #news h3{margin:0 0 6px;font:16px "IM Fell English SC",serif;color:var(--red);border-bottom:1px solid var(--ink2);padding-bottom:3px}
  #news ul{margin:0;padding-left:16px}#news li{margin:3px 0;line-height:1.25}
  #card{position:fixed;top:calc(12px + var(--st));right:calc(12px + var(--sr));width:min(340px,46vw);max-height:calc(100% - var(--barH) - var(--sb) - var(--st) - 24px);-webkit-overflow-scrolling:touch;overflow:auto;padding:14px 18px;display:none;z-index:6}
  #card h2{margin:0 0 2px;font:24px "IM Fell English SC",serif;color:var(--red)}
  #card .where{font-style:italic;color:var(--ink2);font-size:14px;margin-bottom:8px}
  #card ul{margin:0;padding-left:18px;font-size:15px}#card li{margin:5px 0;line-height:1.25}
  #card li.new{color:var(--red)}
  #card .cap{color:var(--ink2);font-size:12px;font-style:italic}
  #card a{color:var(--ink)}
  #card .x{position:absolute;top:4px;right:10px;background:none;border:0;color:var(--ink2);font-size:24px;cursor:pointer;font-family:serif}

  #fitbtn{background:var(--parch);color:var(--ink);border:1px solid var(--ink);padding:5px 10px;border-radius:2px;font:16px serif;cursor:pointer;box-shadow:0 2px 6px #0008}
  .panel h3{cursor:pointer;position:relative;padding-right:22px}
  .panel h3::after{content:"▾";position:absolute;right:0;top:0;color:var(--ink2)}
  .panel.collapsed h3{border-bottom:0;margin:0;padding-bottom:0}
  .panel.collapsed h3::after{content:"▸"}
  .panel.collapsed > :not(h3){display:none}
  .tlbl{pointer-events:auto;cursor:pointer;padding:2px 3px}
  /* ---- Barra de capítulos ---- */
  #bar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--barH) + var(--sb));padding-bottom:calc(6px + var(--sb)) !important;padding-left:calc(18px + var(--sl)) !important;padding-right:calc(18px + var(--sr)) !important;background:linear-gradient(#2a1f15,#1a140e);border-top:2px solid var(--gold);
    padding:8px 18px 6px;display:flex;flex-direction:column;gap:2px;color:var(--parch)}
  #bar .top{display:flex;justify-content:space-between;align-items:baseline}
  #pos{font:21px "IM Fell English SC",serif}#part{font:italic 16px "IM Fell English",serif;color:var(--parch2)}
  #bar .row{display:flex;align-items:flex-start;gap:12px;margin-top:4px}
  #bar .nav{background:var(--parch);color:var(--ink);border:1px solid var(--ink);border-radius:2px;width:34px;height:30px;cursor:pointer;font-size:18px;flex:none}
  #track{position:relative;flex:1;height:62px}
  #ticks{position:absolute;left:0;right:0;top:0;height:62px;pointer-events:none}
  .tick{position:absolute;top:2px;width:1px;height:26px;background:#a8946e}
  .tick.part{background:var(--gold);width:2px;height:30px;top:0}
  .tick.on{background:var(--parch)}
  .tlbl{position:absolute;top:32px;transform:translateX(-50%);font:12px "IM Fell English",serif;color:#a8946e;white-space:nowrap}
  .tlbl.on{color:var(--parch);font-weight:bold}
  .tlbl.hide{display:none}
  input[type=range]{-webkit-appearance:none;appearance:none;position:absolute;left:0;right:0;top:4px;width:100%;height:24px;margin:0;background:transparent;cursor:pointer;z-index:2}
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,var(--red) var(--p,0%),#5a4630 var(--p,0%));border-radius:2px}
  input[type=range]::-moz-range-track{height:4px;background:#5a4630;border-radius:2px}
  input[type=range]::-moz-range-progress{height:4px;background:var(--red)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;transform:rotate(45deg);background:var(--red);border:2px solid var(--parch);box-shadow:0 0 0 1px var(--ink)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;transform:rotate(45deg);background:var(--red);border:2px solid var(--parch);border-radius:0}
  /* Pantallas táctiles: todo más grande para el dedo */
  @media (pointer:coarse){
    :root{--barH:128px}
    .chip{width:40px;height:40px;font-size:18px}
    .chips{gap:6px;width:200px}
    .place .lbl{font-size:18px}
    #maps button,#fitbtn{padding:9px 16px;font-size:18px}
    #bar .nav{width:48px;height:44px;font-size:24px}
    input[type=range]{height:40px;top:-4px}
    input[type=range]::-webkit-slider-thumb{width:28px;height:28px;margin-top:-12px}
    .tick{height:30px}.tlbl{top:36px;font-size:14px}
    #track{height:70px}
    #news,#offmap,#card{font-size:16px}
  }
  /* ---- iPhone / pantallas estrechas ---- */
  @media (max-width:600px){
    :root{--barH:104px}
    #maps{top:calc(8px + var(--st));left:calc(8px + var(--sl))}
    #maps button,#fitbtn{padding:6px 11px;font-size:15px}
    #offmap{top:calc(54px + var(--st));left:calc(8px + var(--sl));width:min(260px,72vw);max-height:40vh;padding:8px 12px}
    #news{left:calc(8px + var(--sl));right:calc(8px + var(--sr));width:auto;max-height:34vh;bottom:calc(var(--barH) + var(--sb) + 8px);padding:8px 12px;font-size:14px}
    #card{left:calc(8px + var(--sl));right:calc(8px + var(--sr));top:auto;bottom:calc(var(--barH) + var(--sb) + 8px);width:auto;max-height:58vh;z-index:7}
    #card h2{font-size:21px}
    .chip{width:34px;height:34px;font-size:15px}
    .chips{width:150px;gap:4px}
    .place .lbl{font-size:15px}
    #bar{padding-left:calc(10px + var(--sl)) !important;padding-right:calc(10px + var(--sr)) !important}
    #pos{font-size:18px}
    #bar .nav{width:38px;height:38px;font-size:20px}
    #bar .row{gap:8px}
    .tlbl{font-size:12px}
  }
  /* iPhone en horizontal: poca altura */
  @media (max-height:500px){
    :root{--barH:78px}
    #bar{padding-top:4px !important}
    #bar .top{position:absolute;left:calc(14px + var(--sl));top:4px}
    #pos{font-size:15px}#part{display:none}
    #bar .row{margin-top:18px}
    #track{height:46px}
    .tick{height:18px}.tlbl{top:22px;font-size:11px}
    #bar .nav{width:36px;height:32px}
    #offmap{max-height:calc(100vh - var(--barH) - 70px)}
    #news{max-height:calc(100vh - var(--barH) - 70px);width:300px;right:auto}
    #card{top:calc(8px + var(--st));bottom:auto;left:auto;width:min(340px,46vw);max-height:calc(100vh - var(--barH) - var(--sb) - 20px)}
  }
</style>
</head>
<body>
<div id="viewport"><div id="stage"><img id="mapimg" alt="Mapa"></div></div>
<div id="maps">
  <button id="fitbtn" title="Encuadrar mapa">⤢</button>
</div>
<div id="offmap" class="panel"></div>
<div id="news" class="panel"></div>
<div id="card" class="panel"><button class="x" onclick="closeCard()">×</button><div id="cardbody"></div></div>
<div id="bar">
  <div class="top"><span id="pos"></span><span id="part"></span></div>
  <div class="row">
    <button class="nav" id="prev" title="Anterior">‹</button>
    <div id="track"><div id="ticks"></div><input type="range" id="slider" min="0" value="0"></div>
    <button class="nav" id="next" title="Siguiente">›</button>
  </div>
</div>

for(let i=1;i<=58;i++) STEPS.push('Capítulo '+i);

// ================= Estado =================
let cur=0, mapId='ttelir', selected=null;
const $=id=>document.getElementById(id);
const slider=$('slider'); slider.max=STEPS.length-1; slider.value=0;

function stateAt(c,s){
  let place=null, traits=[], visible=false, dead=false;
  for(const e of c.ev){ if(e.s<=s){ visible=true; if('place' in e) place=e.place; if('dead' in e) dead=e.dead; if(e.t) traits.push(e); } }
  return {visible,place,traits,dead};
}
function anchor(pid){ return pid; }

// ================= Mapa: pan y zoom =================
const vp=$('viewport'), stage=$('stage'), img=$('mapimg');
let k=1,tx=0,ty=0;
function fit(){
  const m=MAPS[mapId],W=vp.clientWidth,H=vp.clientHeight;
  const phone=Math.min(innerWidth,innerHeight)<500, base=Math.min(W/m.w,H/m.h);
  k = phone ? Math.max(base, H>W ? H/m.h*0.92 : W/m.w) : base; tx=(W-m.w*k)/2; ty=(H-m.h*k)/2; apply();
}
function apply(){
  stage.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
  const inv=Math.min(1/k,2.2);
  document.querySelectorAll('.place').forEach(el=>el.style.transform=`scale(${inv})`);
}
function zoomAt(mx,my,f){ const nk=Math.min(Math.max(k*f,0.2),6); tx=mx-(mx-tx)*nk/k; ty=my-(my-ty)*nk/k; k=nk; apply(); }
vp.addEventListener('wheel',e=>{ e.preventDefault(); const r=vp.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15); },{passive:false});
const pts=new Map(); let last=null;
vp.addEventListener('pointerdown',e=>{ if(e.target.closest('.chip,.lbl')) return; vp.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); vp.classList.add('drag'); });
vp.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ tx+=e.clientX-prev.x; ty+=e.clientY-prev.y; apply(); }
  else if(pts.size===2){ const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
    if(last){ const r=vp.getBoundingClientRect(); zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/last); } last=d; }
});
// Toque simple en el mapa = cerrar ficha · doble toque = acercar
let down=null, lastTap=0;
vp.addEventListener('pointerdown',e=>{ if(!e.target.closest('.chip,.lbl')) down={x:e.clientX,y:e.clientY,t:Date.now(),n:pts.size}; });
['pointerup','pointercancel'].forEach(ev=>vp.addEventListener(ev,e=>{
  pts.delete(e.pointerId); if(pts.size<2) last=null; if(!pts.size) vp.classList.remove('drag');
  if(ev==='pointerup' && down && down.n===1 && Math.hypot(e.clientX-down.x,e.clientY-down.y)<8 && Date.now()-down.t<300){
    const now=Date.now(), r=vp.getBoundingClientRect();
    if(now-lastTap<320){ zoomAt(e.clientX-r.left,e.clientY-r.top,2); lastTap=0; }
    else { lastTap=now; closeCard(); }
  }
  down=null;
}));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
window.addEventListener('resize',()=>{ fit(); buildTicks(); });

function setMap(id){
  mapId=id;
  document.querySelectorAll('#maps button').forEach(b=>b.classList.toggle('on',b.dataset.map===id));
  img.src=MAPS[id].src; img.width=MAPS[id].w; img.height=MAPS[id].h;
  fit(); render();
}
document.querySelectorAll('#maps button').forEach(b=>b.onclick=()=>setMap(b.dataset.map));

// ================= Marcas del deslizador =================
const THUMB=matchMedia('(pointer:coarse)').matches?28:18;
function buildTicks(){
  const box=$('ticks'), W=$('track').clientWidth, n=STEPS.length;
  const every = W/n < 9 ? 10 : W/n < 22 ? 5 : 1;
  const partStarts=new Set(PARTS.map(p=>p[0]));
  box.innerHTML='';
  for(let i=0;i<n;i++){
    const x=THUMB/2+(W-THUMB)*i/(n-1);
    const t=document.createElement('div'); t.className='tick'+(partStarts.has(i)?' part':''); t.style.left=x+'px'; t.dataset.i=i; box.appendChild(t);
    const l=document.createElement('div'); l.className='tlbl'; l.style.left=x+'px'; l.textContent=SHORT[i]; l.dataset.i=i; l.onclick=()=>go(i);
    const num=i-1; if(every>1 && i>1 && i<n-1 && num%every!==0) l.classList.add('hide');
    box.appendChild(l);
  }
  markTicks();
}
function markTicks(){
  document.querySelectorAll('#ticks [data-i]').forEach(el=>el.classList.toggle('on',+el.dataset.i===cur));
  slider.style.setProperty('--p',(cur/(STEPS.length-1)*100)+'%');
}

// ================= Render =================
function render(){
  const s=cur;
  $('pos').textContent=STEPS[cur];
  const part=PARTS.findIndex(([a,b])=>cur>=a&&cur<=b);
  $('part').textContent= part>=0 ? `Parte ${part+1}` : '';
  markTicks();

  stage.querySelectorAll('.place').forEach(n=>n.remove());
  const groups={}, off={}, outside={}, unknown=[];
  for(const [pid,p] of Object.entries(PLACES)) if(p.from<=s){
    if(p.x!=null) groups[pid]=[]; else if(p.out) outside[pid]=[]; else off[pid]=[];
  }
  for(const c of CHARS){
    const st=stateAt(c,s); if(!st.visible) continue;
    if(!st.place){ unknown.push({c,st}); continue; }
    (groups[st.place]||off[st.place]||outside[st.place]||unknown).push({c,st});
  }
  for(const [pid,list] of Object.entries(groups)){
    const p=PLACES[pid], el=document.createElement('div');
    el.className='place'+(p.link?' link':'')+(p.side==='left'?' left':'');
    el.style.left=p.x+'px'; el.style.top=p.y+'px';
    el.innerHTML=`<div class="pin"></div><div class="lbl">${p.name}</div><div class="chips"></div>`;
    el.querySelector('.lbl').onclick=()=> p.link ? setMap(p.link) : showPlace(pid);
    fillChips(el.querySelector('.chips'),list,s);
    stage.appendChild(el);
  }
  // Panel "Fuera del mapa"
  const box=$('offmap'); box.innerHTML='';
  const mk=(o,h)=>Object.entries(o).filter(([,l])=>l.length).map(([pid,l])=>({pid,title:PLACES[pid].name,list:l,h}));
  const sections=[...mk(off,'En T\'Telir, fuera del mapa'),...mk(outside,'Fuera de T\'Telir')];
  if(unknown.length) sections.push({pid:null,title:'Paradero desconocido',list:unknown,h:'Paradero desconocido'});
  if(sections.length){
    box.innerHTML='<h3>Fuera del mapa</h3>'; let lastH=null;
    for(const sec of sections){
      if(sec.h!==lastH && sec.pid){ const hh=document.createElement('div'); hh.className='offh'; hh.textContent=sec.h; box.appendChild(hh); }
      lastH=sec.h;
      const d=document.createElement('div'); d.className='offsec';
      d.innerHTML=`<div class="offt${sec.pid?' link':''}">${sec.title}</div><div class="chips"></div>`;
      if(sec.pid) d.querySelector('.offt').onclick=()=>showPlace(sec.pid);
      fillChips(d.querySelector('.chips'),sec.list,s);
      box.appendChild(d);
    }
    box.style.display='';
  } else box.style.display='none';
  apply();
  renderNews();
  if(selected) selected.type==='char'?showChar(selected.id):showPlace(selected.id);
}

function fillChips(box,list,s){
  list.sort((a,b)=>a.st.dead-b.st.dead);
  for(const {c,st} of list){
    const ch=document.createElement('div'); ch.className='chip'+(st.dead?' dead':''); ch.textContent=c.ini; ch.title=c.name;
    ch.style.setProperty('--c',c.color);
    if(c.ev.some(e=>e.s===s)) ch.classList.add('new');
    ch.onclick=()=>showChar(c.id); box.appendChild(ch);
  }
}
const placeName=pid=>PLACES[pid]?.name||'';
function renderNews(){
  const box=$('news');
  if(cur===0){ box.innerHTML='<h3>Sin empezar</h3>Mueve el control al capítulo por el que vas leyendo.'; return; }
  const items=[];
  for(const p of Object.values(PLACES)) if(p.from===cur) items.push(`Nuevo lugar: <b>${p.name}</b>`);
  for(const c of CHARS){
    const evs=c.ev.filter(e=>e.s===cur); if(!evs.length) continue;
    const first=c.ev[0].s===cur;
    if(first) items.push(`Nuevo personaje: <b>${c.name}</b>`);
    for(const e of evs){
      if(('place' in e) && !first) items.push(`<b>${c.name}</b> → ${e.place?placeName(e.place):'paradero desconocido'}`);
      if(e.t && !first) items.push(`<b>${c.name}</b>: ${e.t}`);
    }
  }
  box.innerHTML=`<h3>Novedades · ${STEPS[cur]}</h3>`+(items.length?'<ul>'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'Sin novedades en el mapa.');
}

function showChar(id){
  const c=CHARS.find(x=>x.id===id), st=stateAt(c,cur);
  if(!st.visible){ closeCard(); return; }
  selected={type:'char',id};
  $('cardbody').innerHTML=`<h2>${c.name}${st.dead?' ✝':''}</h2>
    <div class="where">${st.place?(st.dead?'Visto por última vez en: ':'Ubicación: ')+placeName(st.place):'Paradero desconocido'}</div>
    <ul>${st.traits.map(e=>`<li class="${e.s===cur?'new':''}">${e.t} <span class="cap">(${STEPS[e.s]})</span></li>`).join('')}</ul>`;
  $('card').style.display='block';
}
function showPlace(pid){
  const p=PLACES[pid];
  if(p.from>cur){ closeCard(); return; }
  selected={type:'place',id:pid};
  const here=CHARS.filter(c=>{const st=stateAt(c,cur); return st.visible && !st.dead && st.place && st.place===pid;});
  $('cardbody').innerHTML=`<h2>${p.name}</h2><div class="where">${p.desc}</div>
    ${here.length?'<ul>'+here.map(c=>`<li><a href="#" onclick="showChar('${c.id}');return false">${c.name}</a></li>`).join('')+'</ul>':''}`;
  $('card').style.display='block';
}
function closeCard(){ selected=null; $('card').style.display='none'; }

function go(v){ cur=Math.max(0,Math.min(STEPS.length-1,v)); slider.value=cur; render(); }
slider.addEventListener('input',()=>go(+slider.value));
$('prev').onclick=()=>go(cur-1); $('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{ if(e.target===slider) return; if(e.key==='ArrowLeft') go(cur-1); if(e.key==='ArrowRight') go(cur+1); });

img.onload=fit;
$('fitbtn').onclick=fit;
// Paneles plegables tocando su título
document.addEventListener('click',e=>{ const h=e.target.closest('#news h3,#offmap h3'); if(h) h.parentElement.classList.toggle('collapsed'); });
if(innerWidth<1000 || innerHeight>innerWidth) $('news').classList.add('collapsed');
if(innerWidth<600 || innerHeight<500) $('offmap').classList.add('collapsed');
buildTicks();
setMap('ttelir');
go(0);
